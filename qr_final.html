<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carregar Carrossel</title><style>body{background:#111;color:#fff;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:16px;text-align:center}div{max-width:400px}h1{font-size:20px;margin-bottom:8px;color:#c2a25b}p{font-size:14px;color:rgba(255,255,255,.7);margin-bottom:24px}button{background:#c2a25b;color:#111;border:none;border-radius:8px;padding:12px 32px;font-size:16px;font-weight:700;cursor:pointer}button:hover{opacity:.9}.loading{opacity:.5;pointer-events:none}</style></head><body><div id="root"><h1>Carregando...</h1><p style="color:rgba(255,255,255,.5)">Aguarde um momento</p></div><script>(async()=>{try{const r=await fetch('/api/supabase/load/e8f63f11-133f-472e-834d-ba2105876c24');if(!r.ok)throw new Error();const d=await r.json();document.getElementById('root').innerHTML='<h1>'+(d.extra?.name||'Carrossel')+'</h1><p>Carregar este carrossel no seu dispositivo?</p><button id="importBtn">Importar</button><div id="status" style="margin-top:16px;font-size:13px;color:rgba(255,255,255,.5)"></div>';document.getElementById('importBtn').addEventListener('click',async()=>{const btn=document.getElementById('importBtn');btn.disabled=true;btn.textContent='Importando...';try{localStorage.setItem('carrossel-store-v2',JSON.stringify({state:{cards:d.cards||[],topic:d.extra?.topic||'',goal:d.extra?.goal||'authority',tone:d.extra?.tone||'direto',designPreset:d.extra?.designPreset||null,colorTheme:d.extra?.colorTheme||null,framework:d.extra?.framework||'aida',generatedCaption:d.extra?.generatedCaption||'',generatedCta:d.extra?.generatedCta||'',generatedHashtags:d.extra?.generatedHashtags||[],brand:d.extra?.brand||{logo:null,primaryColor:'#c2a25b',secondaryColor:'#ffffff',fontTitle:'Inter, sans-serif',fontBody:'Inter, sans-serif',applyByDefault:false},highlight:d.extra?.highlight||{mode:'off',style:'bold'}}}}));btn.textContent='Importado!';setTimeout(()=>{window.location.href='/'},1500)}catch(e){document.getElementById('status').textContent='Erro ao importar. Tente novamente.';btn.disabled=false;btn.textContent='Importar'}})}catch(e){document.getElementById('root').innerHTML='<h1 style="color:rgba(255,255,255,.5)">Carrossel não encontrado</h1>'}})()</script></body></html>
